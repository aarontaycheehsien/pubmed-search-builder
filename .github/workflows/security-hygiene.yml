name: Security hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Codex hook configuration
        run: python -m json.tool .codex/hooks.json
      - name: Check repository hygiene
        run: python scripts/repository_hygiene.py
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests
